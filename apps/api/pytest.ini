[pytest]
asyncio_mode = auto
# Run the whole suite on ONE session-scoped event loop. The session-scoped async
# `engine_fixture` opens asyncpg connections bound to a single loop; with the
# pytest-asyncio default (a fresh loop per test) those connections get reused
# from a different loop on every later test, which aiosqlite tolerates but real
# asyncpg/Postgres rejects (mass failures + transaction-start errors in CI).
# Pinning fixture + test loop scope to session keeps the engine, sessions, and
# tests on one loop (also silences the unset-loop-scope deprecation warning).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    unit: pure logic, no DB
    integration: tests that use an HTTP client or DB
    postgres: requires real PostgreSQL + pgvector, skipped on SQLite
    pandoc: requires the pandoc CLI on PATH, skipped when absent (runs in CI)

[project]
name = "alexandria-ai"
version = "0.1.0"
description = "Alexandria AI service: LiteLLM model routing, AI generation endpoints, provider config, generation-job status, and the RQ worker."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "cryptography>=48.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "pgvector>=0.3",
    "alexandria-db",
]

[tool.uv.sources]
alexandria-db = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Test modules tolerate long single-line assertions and inline fixture setup
# (e.g. chained `(await client.post(...)).json()["id"]` calls) where wrapping
# every line hurts readability more than it helps. Source code (`app/**`) stays
# strict on E501 — only the line-length rule is relaxed here, and only for tests.
# All logic rules (F-series, imports, etc.) remain enforced in tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgewriter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgewriter}
      POSTGRES_DB: ${POSTGRES_DB:-forgewriter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgewriter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # `ollama list` hits the local API (GET /api/tags) and exits non-zero if the
    # server isn't up — a self-contained check needing no extra tooling (the
    # ollama image ships no curl/wget, but the ollama CLI is always present).
    # NOTE: api/ai do NOT gate on this (no depends_on ollama: service_healthy):
    # Ollama is used LAZILY (only when an AI action runs), so the AI service can
    # boot and serve provider/job routes before any model is pulled. This
    # healthcheck is for visibility + the `web` UX, not a startup barrier.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # DOMAIN service only (Alexandria split): projects/books/chapters/scenes/
    # beats/codex/snippets/style-guide/relations/progressions/auth/exports +
    # revisions. AI/provider/job routes + their env (OLLAMA_BASE_URL,
    # DEFAULT_LOCAL_MODEL, PROVIDER_ENCRYPTION_KEY) live on the ``ai`` service.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgewriter}:${POSTGRES_PASSWORD:-forgewriter}@postgres:5432/${POSTGRES_DB:-forgewriter}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Same absolute path as the ai/worker services: exports READ the cover
      # binaries the AI image generator WRITES (media_assets.file_path is
      # stored under MEDIA_DIR, so it must resolve identically everywhere).
      MEDIA_DIR: /data/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/data/media

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgewriter}:${POSTGRES_PASSWORD:-forgewriter}@postgres:5432/${POSTGRES_DB:-forgewriter}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_LOCAL_MODEL: ${DEFAULT_LOCAL_MODEL:-ollama/llama3.2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Absolute + shared with api/worker: generated image binaries land here
      # and their stored file_path must be readable from the api container too
      # (cover embedding in EPUB/PDF exports). The default "./media" would be
      # container-local AND relative to each service's own workdir.
      MEDIA_DIR: /data/media
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/prompts:/app/prompts:ro
      - media_data:/data/media

  worker:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    restart: unless-stopped
    # AI owns generation jobs, so the RQ worker is built from the AI image and
    # runs its worker entrypoint (queue name + Redis URL come from app.worker).
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgewriter}:${POSTGRES_PASSWORD:-forgewriter}@postgres:5432/${POSTGRES_DB:-forgewriter}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_LOCAL_MODEL: ${DEFAULT_LOCAL_MODEL:-ollama/llama3.2}
      # Same shared media volume as ai/api (image jobs run on this worker).
      MEDIA_DIR: /data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/prompts:/app/prompts:ro
      - media_data:/data/media

  web:
    # Next.js frontend (App Router). Runs the dev server from the mounted
    # monorepo via pnpm — there is no apps/web/Dockerfile (the frontend is built
    # on Vercel for deploys; this service is for local Docker Compose dev).
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev"
    environment:
      # Browser-exposed base URLs (Alexandria split): domain backend vs AI service.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL:-http://localhost:8001}
      # Optional single-user dev bearer-token fallback (read by lib/api/client.ts
      # when localStorage has no token). Empty by default; opt-in via .env. NOTE:
      # NEXT_PUBLIC_* is compiled into the browser bundle — never set in production
      # or shared preview deployments.
      NEXT_PUBLIC_DEV_TOKEN: ${NEXT_PUBLIC_DEV_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ai
    # HTTP check on the Next.js dev server. busybox `wget` ships in node:22-alpine
    # (no extra install). A generous start_period covers the first-run
    # `pnpm install` + dev-server warmup before failures count.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  media_data:

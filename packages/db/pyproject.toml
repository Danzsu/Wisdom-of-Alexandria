[project]
name = "alexandria-db"
version = "0.1.0"
description = "Shared persistence layer for Alexandria: SQLAlchemy models, DB session, config, security, deps."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "pgvector>=0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["alexandria_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

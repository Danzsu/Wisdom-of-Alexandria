name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Backend: ruff + Alembic migrations + pytest (apps/api & apps/ai) against a
  # real PostgreSQL + pgvector service. Running on Postgres is what actually
  # exercises the migrations (incl. the pgvector extension + embeddings table)
  # and unskips the @pytest.mark.postgres tests (the test conftest derives
  # IS_POSTGRES from TEST_DATABASE_URL).
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector-enabled Postgres so `CREATE EXTENSION vector` + the vector()
        # column DDL work (same image family as docker-compose).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forgewriter
          POSTGRES_PASSWORD: forgewriter
          POSTGRES_DB: forgewriter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgewriter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # JWT signing secret (shared by apps/api auth and apps/ai token validation).
      SECRET_KEY: ci-test-secret-key-not-for-production
      # Main app DB — migrations run here.
      DATABASE_URL: postgresql+asyncpg://forgewriter:forgewriter@localhost:5432/forgewriter
      # Dedicated test DB — pytest conftest builds the schema here via create_all,
      # and IS_POSTGRES becomes true so the postgres-marked tests run.
      TEST_DATABASE_URL: postgresql+asyncpg://forgewriter:forgewriter@localhost:5432/forgewriter_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      # pandoc powers the DOCX/EPUB export conversion. Installing it here unskips
      # the @pytest.mark.pandoc round-trip test (it skips locally where pandoc is
      # absent) so the real md->docx/epub conversion is exercised in CI.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install workspace (with dev deps)
        run: uv sync

      # PROVIDER_ENCRYPTION_KEY must be a valid Fernet key (urlsafe base64, 32
      # bytes). Generate a fresh one per run rather than committing a key.
      - name: Generate provider encryption key
        run: |
          KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "PROVIDER_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Ruff (apps/api)
        run: uv run --directory apps/api ruff check

      - name: Ruff (apps/ai)
        run: uv run --directory apps/ai ruff check

      # Genuinely EXECUTE every migration's upgrade() on a fresh Postgres. Fails
      # CI if a migration is broken (this includes `CREATE EXTENSION vector`, the
      # vector(1536) embeddings column, and the ivfflat cosine index).
      - name: Alembic upgrade head (apps/api, Postgres)
        run: uv run --directory apps/api alembic upgrade head

      # The test DB is a SEPARATE database that pytest builds with create_all
      # (not migrations). create_all emits the vector() column DDL, which requires
      # the `vector` extension to already exist — so create it here before pytest.
      - name: Create test database + pgvector extension
        env:
          PGPASSWORD: forgewriter
        run: |
          psql -h localhost -U forgewriter -d forgewriter \
            -c "CREATE DATABASE forgewriter_test"
          psql -h localhost -U forgewriter -d forgewriter_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Pytest (apps/api)
        run: uv run --directory apps/api pytest -q

      # apps/ai owns the 4 @pytest.mark.postgres tests; with TEST_DATABASE_URL
      # pointing at Postgres they run instead of skipping.
      - name: Pytest (apps/ai)
        run: uv run --directory apps/ai pytest -q

  # ---------------------------------------------------------------------------
  # Frontend: type-check + lint + vitest.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type-check
        run: corepack pnpm -C apps/web type-check

      - name: Lint
        run: corepack pnpm -C apps/web lint

      - name: Test
        run: corepack pnpm -C apps/web test

  # ---------------------------------------------------------------------------
  # Lighthouse CI (P1L-2): ADVISORY performance / a11y / best-practices / SEO
  # signal on the built web app. `continue-on-error: true` makes it NON-BLOCKING
  # — a regression surfaces as a soft warning + an uploaded report artifact, but
  # never fails the pipeline or gates a deploy. Assertions are `warn`-level
  # (see lighthouserc.json), so the job is informational by design.
  # ---------------------------------------------------------------------------
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build web
        run: corepack pnpm -C apps/web build

      # lhci boots `next start`, audits the URLs in lighthouserc.json, and writes
      # reports to .lighthouseci. Pulled ephemerally via dlx so the lockfile is
      # untouched. Chrome is preinstalled on the ubuntu-latest runner.
      - name: Run Lighthouse CI
        run: corepack pnpm dlx @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Shared-types freshness: the committed OpenAPI-generated types in
  # `packages/shared` are the FE↔BE contract. Re-run the generation pipeline
  # (per-app OpenAPI dump + openapi-typescript) against the current backend and
  # FAIL if the checked-in artifacts are stale — this is the automated drift
  # detection that replaced the interim fixture drift-guard. Needs BOTH uv (the
  # two FastAPI OpenAPI dumps) and node/pnpm (openapi-typescript).
  # ---------------------------------------------------------------------------
  shared-types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install workspace (Python, with dev deps)
        run: uv sync

      - name: Install workspace (Node)
        run: corepack pnpm install --frozen-lockfile

      - name: Regenerate shared types from the backend OpenAPI
        run: bash scripts/gen-shared-types.sh

      # Fails if the regenerated types/JSON differ from the committed copies,
      # i.e. the backend schema drifted and `packages/shared` was not refreshed.
      - name: Verify committed shared types are fresh
        run: git diff --exit-code -- packages/shared/openapi packages/shared/src

  # ---------------------------------------------------------------------------
  # E2E (Playwright): boots the full stack as SEPARATE processes — api + ai +
  # web — and runs the browser smoke against the running web app. The apps/api +
  # apps/ai `app` package name collision is a NON-issue here: each backend runs
  # in its own process (cwd resolves its own local `app`), so no rename or web
  # Dockerfile is needed. ADVISORY (continue-on-error) for now: it's the E2E
  # foundation; harden the journeys + flip to a required gate once stable.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forgewriter
          POSTGRES_PASSWORD: forgewriter
          POSTGRES_DB: forgewriter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgewriter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://forgewriter:forgewriter@localhost:5432/forgewriter
      REDIS_URL: redis://localhost:6379
      OLLAMA_BASE_URL: http://localhost:11434
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_URL: http://localhost:8001
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable

      - name: Install workspaces
        run: |
          uv sync
          corepack pnpm install --frozen-lockfile

      - name: Generate provider encryption key
        run: |
          KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "PROVIDER_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Migrate the database
        run: uv run --directory apps/api alembic upgrade head

      - name: Start the backend services (api + ai)
        run: |
          uv run --directory apps/api uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          uv run --directory apps/ai uvicorn app.main:app --port 8001 > /tmp/ai.log 2>&1 &

      - name: Build + start the web app
        run: |
          corepack pnpm -C apps/web build
          corepack pnpm -C apps/web start > /tmp/web.log 2>&1 &

      - name: Wait for the stack to be ready
        run: |
          for url in http://localhost:8000/health http://localhost:8001/health http://localhost:3000; do
            for i in $(seq 1 60); do
              if curl -sSf "$url" >/dev/null 2>&1; then echo "ready: $url"; break; fi
              if [ "$i" = "60" ]; then echo "TIMEOUT: $url"; cat /tmp/api.log /tmp/ai.log /tmp/web.log; exit 1; fi
              sleep 2
            done
          done

      - name: Run Playwright E2E
        working-directory: apps/web
        run: |
          corepack pnpm dlx playwright@1.49.1 install --with-deps chromium
          corepack pnpm dlx playwright@1.49.1 test

  # ---------------------------------------------------------------------------
  # TODO (future):
  #   deploy: runs only after e2e passes -> Vercel (web) + Cloud Run (api).
  #   Deferred until E2E is a required gate + deployment targets/secrets exist.
  # ---------------------------------------------------------------------------
